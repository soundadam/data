[project]
name = "dataservice"
version = "0.1.0"
description = "The lab's competition datasets on my.soundadam.com/data/ and data.api: metadata from Parquet, bytes by presigned URL."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "soundadam" }]
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "numpy>=2.1",
    "pyarrow>=18",
]

[project.scripts]
dataservice = "dataservice.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataservice"]

[dependency-groups]
dev = ["ruff>=0.16", "pytest>=9"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
# Embedded HTML (page.py copies platform-gitops' portals) runs long, as it does there.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dataservice", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
